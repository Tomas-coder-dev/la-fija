<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="La Fija – Controla tus tarjetas de crédito y ciclos de facturación.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="La Fija">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>La Fija</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!--
    Supabase OAuth Redirect Handler
    Este script captura el fragment (#access_token=...) que Supabase devuelve
    tras el flujo OAuth y lo convierte en un query param para que Flutter Web
    pueda procesarlo correctamente.
  -->
  <script>
    // Needed for Supabase OAuth redirect on Flutter Web
    if (window.location.hash && window.location.hash.startsWith('#access_token')) {
      const hashParams = new URLSearchParams(window.location.hash.substring(1));
      const newUrl = window.location.origin +
                     window.location.pathname +
                     '?' + hashParams.toString();
      window.location.replace(newUrl);
    }
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
