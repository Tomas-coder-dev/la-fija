name: la_fija
description: Aplicación de control de gastos por tarjeta de crédito con ciclos de facturación inteligentes.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: ^2.8.4
  percent_indicator: ^4.2.3
  intl: ^0.19.0
  google_fonts: ^6.2.1
  flutter_riverpod: ^2.5.1
  fl_chart: ^0.68.0
  shimmer: ^3.0.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.3
  google_nav_bar: ^5.0.6
  speech_to_text: ^6.6.0
  permission_handler: ^11.3.1
  google_generative_ai: ^0.4.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
